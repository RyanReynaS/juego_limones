<!-- ==========================================
     ARCHIVO: limones.html
     JUEGO: Atrapar Limones del Cielo
     ==========================================
     Este es el archivo HTML principal. Define la estructura de la página:
     el canvas (pantalla del juego), botones de control, y estadísticas.
     ========================================== -->

<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Metadatos de la página -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Título que aparece en la pestaña del navegador -->
  <title>Caza Limones</title>

  <!-- Vincular el archivo CSS para estilos visuales (colores, tamaños, espacios) -->
  <link rel="stylesheet" href="limones.css">

  <!-- IMPORTANTE: Cargar el archivo de utilidades PRIMERO (debe ir antes de limones.js)
       porque limones.js necesita usar las funciones generarAleatorio() y mostrarEnSpan() -->
  <script src="utils.js"></script>
</head>

<!-- La etiqueta body carga el juego automáticamente con onload="iniciar()" -->
<body onload="iniciar()">
  <!-- Contenedor principal que centra todo -->
  <div class="contenedor">
    <header class="encabezado">
      <!-- Título del juego -->
      <p class="etiqueta">JUEGO ARCADE</p>
      <h1>Atrapar Limones</h1>

      <!-- Información adicional -->
      <p class="subtitulo">Si del cielo te caen limones, ¡atrapa todos los que puedas!</p>

      <!-- Autor del juego -->
      <p class="autor">Creado por <strong>Ryan Reyna</strong></p>
    </header>

    <!-- ==========================================
         CANVAS - La pantalla del juego
         ========================================== -->
    <!-- El canvas es donde se dibuja todo (el personaje, los limones, etc.)
         width="600" = ancho de 600 píxeles
         height="400" = alto de 400 píxeles
         Este elemento se controla totalmente desde JavaScript -->
    <div class="marco-juego">
      <canvas id="areaJuego" width="600" height="400"></canvas>
    </div>

    <!-- ==========================================
         PANEL DE INFORMACIÓN
         ========================================== -->
    <!-- Muestra el puntaje y las vidas restantes -->
    <div class="panel">
      <!-- Puntaje: el <span id="txtPuntaje"> se actualiza dinámicamente desde JavaScript -->
      <p class="estadistica"><span class="nombre-estadistica">Puntaje</span><span id="txtPuntaje">0</span></p>
      <!-- Vidas: el <span id="txtVidas"> se actualiza dinámicamente desde JavaScript -->
      <p class="estadistica"><span class="nombre-estadistica">Vidas</span><span id="txtVidas">3</span></p>
    </div>

    <!-- ==========================================
         BOTONES DE CONTROL
         ========================================== -->
    <!-- Los botones permiten mover el personaje izquierda/derecha y reiniciar -->
    <div class="botones">
      <!-- Botón para mover a la izquierda - Llama a moverIzquierda() -->
      <button type="button" class="boton-mover" onclick="moverIzquierda()"><span aria-hidden="true">←</span> Izquierda</button>

      <!-- Botón para mover a la derecha - Llama a moverDerecha() -->
      <button type="button" class="boton-mover" onclick="moverDerecha()">Derecha <span aria-hidden="true">→</span></button>

      <!-- Botón para reiniciar el juego - Llama a reiniciar() -->
      <button type="button" class="boton-reiniciar" onclick="reiniciar()"><span aria-hidden="true">↻</span> Reiniciar</button>
    </div>
  </div>

  <!-- ==========================================
       CARGAR LA LÓGICA DEL JUEGO
       ========================================== -->
  <!-- Este archivo contiene todas las funciones principales del juego
       (iniciar, moverIzquierda, detectarAtrapado, etc.)
       IMPORTANTE: Se carga DESPUÉS del HTML para que pueda acceder a los elementos
       y DESPUÉS de utils.js para poder usar sus funciones -->
  <script src="limones.js"></script>
</body>
</html>
